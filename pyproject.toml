[project]
name = "langchain-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rmsid1312", email = "rmsid1312@naver.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=25.11.0",
    "isort>=6.1.0",
    "langchain-anthropic>=0.3.22",
    "langchain-community>=0.4.2",
    "langchain-ollama>=0.3.10",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "python-dotenv>=1.2.1",
    "tavily-python>=0.8.5",
    "unstructured>=0.27.36",
]

[project.scripts]
langchain = "langchain_study:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
